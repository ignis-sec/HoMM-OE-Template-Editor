[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "templategen"
version = "0.0.1"
description = "Graphical editor for Heroes of Might and Magic: Olden Era random-map templates"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Ata Hakçıl" }]
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "pydantic>=2.5",
    "pyqtdarktheme-fork>=2.3",
    "qtawesome>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
templategen = "templategen.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/templategen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
qt_api = "pyside6"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "templategen.ui.*"
disallow_untyped_calls = false
warn_return_any = false

[tool.coverage.run]
source = ["src/templategen"]
branch = true
concurrency = ["thread", "greenlet"]
omit = [
  "tests/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 60

exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.coverage.html]
directory = "htmlcov"
