name: Release

on:
  push:
    tags: ["v*"]
    branches: [pre-release]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        shell: bash
        run: python -m pip install --upgrade pip

      - name: Install project (with all dependencies)
        shell: bash
        run: pip install --verbose .

      - name: Install PyInstaller
        shell: bash
        run: pip install pyinstaller

      - name: Show installed packages
        shell: bash
        run: pip list

      - name: Verify PySide6 is importable
        shell: bash
        run: python -c "import PySide6, PySide6.QtWidgets; print('PySide6 at', PySide6.__file__)"

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller `
            --name "HoMM OE Template Editor" `
            --onefile `
            --windowed `
            --noconfirm `
            --log-level INFO `
            --add-data "src/templategen/img;templategen/img" `
            --collect-submodules templategen `
            --collect-all UnityPy `
            launch.py

      - name: Inspect build output
        shell: pwsh
        run: |
          Get-ChildItem dist | Format-Table Name, Length
          $exe = "dist/HoMM OE Template Editor.exe"
          if (-not (Test-Path $exe)) { throw "exe not built at $exe" }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host ("exe size: {0:N1} MB" -f $size)
          if ($size -lt 30) { throw "exe is only ${size}MB — PySide6 was not bundled" }

      - name: Rename exe with tag (catalog + icons are built from the user's game
              install on first launch, so the bare exe is the whole release)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $src = "dist/HoMM OE Template Editor.exe"
          $dst = "dist/HoMM OE Template Editor-$tag-windows.exe"
          Move-Item $src $dst
          Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize

      - name: Log SHA-256 of the release exe
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = "dist/HoMM OE Template Editor-$tag-windows.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA-256 ($((Split-Path $exe -Leaf))): $hash"

      - name: Upload Windows release exe
        uses: actions/upload-artifact@v4
        with:
          name: homm-oe-template-editor-windows
          path: dist/HoMM OE Template Editor-*-windows.exe

  package-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build source archive
        run: |
          tag="${GITHUB_REF_NAME}"
          git archive --format=zip --prefix="HoMM OE Template Editor-${tag}/" -o "HoMM OE Template Editor-${tag}-source.zip" HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: homm-oe-template-editor-source
          path: HoMM OE Template Editor-*-source.zip

  release:
    needs: [build-windows, package-source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: homm-oe-template-editor-windows
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: homm-oe-template-editor-source
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Branch pushes use the fixed "prerelease" tag (replaces previous prerelease);
          # tag pushes use the tag name itself (e.g. v0.0.7). The tag deliberately
          # does NOT match the branch name "pre-release" — sharing a name between a
          # branch and a tag breaks GitHub Desktop's ref resolution.
          tag_name: ${{ github.ref_type == 'branch' && 'prerelease' || github.ref_name }}
          name: ${{ github.ref_type == 'branch' && format('Prerelease ({0})', github.sha) || github.ref_name }}
          prerelease: ${{ github.ref_type == 'branch' }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/HoMM OE Template Editor-*-windows.exe
            dist/HoMM OE Template Editor-*-source.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
