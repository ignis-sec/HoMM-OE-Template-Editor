name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        shell: bash
        run: python -m pip install --upgrade pip

      - name: Install project (with all dependencies)
        shell: bash
        run: pip install --verbose .

      - name: Install PyInstaller
        shell: bash
        run: pip install pyinstaller

      - name: Show installed packages
        shell: bash
        run: pip list

      - name: Verify PySide6 is importable
        shell: bash
        run: python -c "import PySide6, PySide6.QtWidgets; print('PySide6 at', PySide6.__file__)"

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller `
            --name "HoMM OE Template Editor" `
            --onefile `
            --windowed `
            --noconfirm `
            --log-level INFO `
            --add-data "src/templategen/img;templategen/img" `
            --add-data "data/catalog.json;data" `
            --collect-submodules templategen `
            launch.py

      - name: Inspect build output
        shell: pwsh
        run: |
          Get-ChildItem dist | Format-Table Name, Length
          $exe = "dist/HoMM OE Template Editor.exe"
          if (-not (Test-Path $exe)) { throw "exe not built at $exe" }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host ("exe size: {0:N1} MB" -f $size)
          if ($size -lt 30) { throw "exe is only ${size}MB — PySide6 was not bundled" }

      - name: Rename artifact with version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Move-Item "dist/HoMM OE Template Editor.exe" "dist/HoMM OE Template Editor-$tag-windows.exe"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: homm-oe-template-editor-windows
          path: dist/HoMM OE Template Editor-*-windows.exe

  package-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build source archive
        run: |
          tag="${GITHUB_REF_NAME}"
          git archive --format=zip --prefix="HoMM OE Template Editor-${tag}/" -o "HoMM OE Template Editor-${tag}-source.zip" HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: homm-oe-template-editor-source
          path: HoMM OE Template Editor-*-source.zip

  release:
    needs: [build-windows, package-source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: homm-oe-template-editor-windows
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: homm-oe-template-editor-source
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HoMM OE Template Editor-*-windows.exe
            dist/HoMM OE Template Editor-*-source.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
