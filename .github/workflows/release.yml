name: Release

on:
  push:
    tags: ["v*"]
    branches: [pre-release]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      is_prerelease: ${{ steps.tag.outputs.is_prerelease }}
    steps:
      - id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "branch" ]; then
            # Unique per-commit tag so each prerelease is a distinct release.
            echo "release_tag=prerelease-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: [resolve-tag]
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        shell: bash
        run: python -m pip install --upgrade pip

      - name: Install project (with all dependencies)
        shell: bash
        run: pip install --verbose .

      - name: Install PyInstaller
        shell: bash
        run: pip install pyinstaller

      - name: Show installed packages
        shell: bash
        run: pip list

      - name: Verify PySide6 is importable
        shell: bash
        run: python -c "import PySide6, PySide6.QtWidgets; print('PySide6 at', PySide6.__file__)"

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller `
            --name "HoMM OE Template Editor" `
            --onefile `
            --windowed `
            --noconfirm `
            --log-level INFO `
            --add-data "src/templategen/img;templategen/img" `
            --collect-submodules templategen `
            --collect-all UnityPy `
            launch.py

      - name: Inspect build output
        shell: pwsh
        run: |
          Get-ChildItem dist | Format-Table Name, Length
          $exe = "dist/HoMM OE Template Editor.exe"
          if (-not (Test-Path $exe)) { throw "exe not built at $exe" }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host ("exe size: {0:N1} MB" -f $size)
          if ($size -lt 30) { throw "exe is only ${size}MB — PySide6 was not bundled" }

      - name: Rename exe with release tag (catalog + icons are built from the user's
              game install on first launch, so the bare exe is the whole release)
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $src = "dist/HoMM OE Template Editor.exe"
          $dst = "dist/HoMM OE Template Editor-$tag-windows.exe"
          Move-Item $src $dst
          Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize

      - name: Log SHA-256 of the release exe
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $exe = "dist/HoMM OE Template Editor-$tag-windows.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA-256 ($((Split-Path $exe -Leaf))): $hash"

      - name: Upload Windows release exe
        uses: actions/upload-artifact@v4
        with:
          name: homm-oe-template-editor-windows
          path: dist/HoMM OE Template Editor-*-windows.exe

  package-source:
    needs: [resolve-tag]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Build source archive
        run: |
          git archive --format=zip --prefix="HoMM OE Template Editor-${RELEASE_TAG}/" -o "HoMM OE Template Editor-${RELEASE_TAG}-source.zip" HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: homm-oe-template-editor-source
          path: HoMM OE Template Editor-*-source.zip

  release:
    needs: [resolve-tag, build-windows, package-source]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.release_tag }}
      IS_PRERELEASE: ${{ needs.resolve-tag.outputs.is_prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: homm-oe-template-editor-windows
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: homm-oe-template-editor-source
          path: dist

      - name: Sweep stale prereleases (keep only the one we're about to publish)
        if: env.IS_PRERELEASE == 'true'
        shell: bash
        run: |
          # Remove any release/tag starting with "prerelease" except the current target.
          # Catches the legacy bare "prerelease" tag too, plus any older prerelease-<sha>.
          gh release list --limit 100 --json tagName \
            | jq -r '.[] | .tagName' \
            | grep -E '^prerelease(-|$)' \
            | grep -vx "$RELEASE_TAG" \
            | while read -r tag; do
                echo "Deleting stale prerelease: $tag"
                gh release delete "$tag" --yes --cleanup-tag || true
              done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.IS_PRERELEASE == 'true' && format('Prerelease ({0})', env.RELEASE_TAG) || env.RELEASE_TAG }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/HoMM OE Template Editor-*-windows.exe
            dist/HoMM OE Template Editor-*-source.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
